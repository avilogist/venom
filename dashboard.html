<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1"
    >

    <title>Venom | Dashboard</title>

    <link
        rel="icon"
        type="image/png"
        href="assets/venom.png"
    >

    <link
        rel="preconnect"
        href="https://fonts.googleapis.com"
    >

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin
    >

    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap"
        rel="stylesheet"
    >

    <script src="https://unpkg.com/lucide@latest"></script>

    <style>
        * {
            box-sizing: border-box;
        }

        [hidden] {
            display: none !important;
        }

        html,
        body {
            margin: 0;
            min-height: 100%;
            background: #050505;
            color: #f3f3f3;
            font-family: Inter, system-ui, sans-serif;
        }

        body {
            min-height: 100vh;
            overflow-x: hidden;
            background:
                radial-gradient(
                    circle at 18% -10%,
                    rgba(213,40,40,.08),
                    transparent 31%
                ),
                radial-gradient(
                    circle at 88% 12%,
                    rgba(88,101,242,.045),
                    transparent 28%
                ),
                #050505;
        }

        button,
        input,
        a {
            font: inherit;
        }

        button,
        a,
        .value,
        .label,
        .accountName,
        .accountSub {
            text-shadow:
                -.55px -.55px 0 rgba(255,255,255,.13),
                .7px .9px 0 rgba(0,0,0,.95),
                0 1.5px 2px rgba(0,0,0,.45);
        }

        svg {
            filter:
                drop-shadow(
                    -.6px -.6px 0 rgba(255,255,255,.15)
                )
                drop-shadow(
                    .7px .8px 0 rgba(0,0,0,.95)
                );
        }

        .top {
            height: 70px;
            padding: 0 clamp(15px,3vw,30px);
            border-bottom: 1px solid #171717;
            background: rgba(5,5,5,.94);
            backdrop-filter: blur(16px);
            display: flex;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 30;
        }

        .logo {
            width: clamp(145px,16vw,190px);
            height: 50px;
            object-fit: contain;
            object-position: left center;
        }

        .nav {
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
            height: 100%;
            display: flex;
            align-items: center;
            gap: clamp(15px,2.4vw,30px);
        }

        .nav a {
            height: 100%;
            display: flex;
            align-items: center;
            color: #7b7b7b;
            text-decoration: none;
            font-size: 11px;
            font-weight: 600;
            letter-spacing: .07em;
            position: relative;
        }

        .nav a:hover,
        .nav a.on {
            color: #d92d2d;
        }

        .nav a.on::after {
            content: "";
            position: absolute;
            left: 0;
            right: 0;
            bottom: 19px;
            height: 2px;
            border-radius: 999px;
            background: #d92d2d;
        }

        .home {
            margin-left: auto;
            width: 36px;
            height: 36px;
            border: 1px solid #202020;
            border-radius: 9px;
            color: #8b8b8b;
            background: #0d0d0d;
            display: grid;
            place-items: center;
            text-decoration: none;
        }

        .home:hover {
            color: #d92d2d;
            border-color: #342020;
        }

        .home svg {
            width: 17px;
            height: 17px;
        }

        .shell {
            width: min(1180px,calc(100% - 28px));
            margin: 0 auto;
            padding: 34px 0 110px;
        }

        .hero {
            display: flex;
            align-items: flex-end;
            justify-content: space-between;
            gap: 20px;
            margin-bottom: 20px;
        }

        .heroAccount {
            display: flex;
            align-items: center;
            gap: 13px;
        }

        .heroAvatar {
            width: 52px;
            height: 52px;
            min-width: 52px;
            border-radius: 50%;
            border: 1px solid #292929;
            background: #111;
            overflow: hidden;
            display: grid;
            place-items: center;
            color: #666;
            box-shadow:
                0 8px 24px rgba(0,0,0,.32);
        }

        .heroAvatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .heroAvatar svg {
            width: 19px;
            height: 19px;
        }

        .hero h1 {
            margin: 0;
            color: #ededed;
            font-size: clamp(23px,3vw,34px);
            font-weight: 600;
            letter-spacing: -.035em;
        }

        .hero p {
            margin: 8px 0 0;
            color: #666;
            font-size: 11px;
            line-height: 1.6;
        }

        .heroGreetingLine,
        .accountNameLine {
            display: flex;
            align-items: center;
            gap: 5px;
            flex-wrap: wrap;
        }

        .roleBadge {
            width: 16px;
            height: 16px;
            object-fit: contain;
            vertical-align: middle;
            filter:
                drop-shadow(
                    0 1px 3px rgba(0,0,0,.6)
                );
        }

        .stats {
            display: grid;
            grid-template-columns:
                repeat(
                    4,
                    minmax(
                        0,
                        1fr
                    )
                );
            gap: 12px;
        }

        .card {
            border: 1px solid #1c1c1c;
            border-radius: 13px;
            background:
                radial-gradient(
                    circle at 8% 0%,
                    rgba(255,255,255,.038),
                    transparent 32%
                ),
                #0b0b0b;
            box-shadow:
                inset 1px 1px 0 rgba(255,255,255,.025),
                0 14px 42px rgba(0,0,0,.22);
        }

        .stat {
            min-height: 116px;
            padding: 16px;
        }

        .statTop {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
        }

        .label {
            color: #666;
            font-size: 9px;
            font-weight: 600;
            letter-spacing: .06em;
            text-transform: uppercase;
        }

        .statIcon {
            width: 30px;
            height: 30px;
            border: 1px solid #202020;
            border-radius: 8px;
            background: #101010;
            color: #727272;
            display: grid;
            place-items: center;
        }

        .statIcon svg {
            width: 14px;
            height: 14px;
        }

        .value {
            margin-top: 14px;
            color: #e6e6e6;
            font-size: 18px;
            font-weight: 600;
            letter-spacing: -.02em;
            overflow-wrap: anywhere;
        }

        .subvalue {
            margin-top: 4px;
            color: #555;
            font-size: 9px;
        }

        .layout {
            margin-top: 12px;
            display: grid;
            grid-template-columns:
                minmax(
                    0,
                    1.55fr
                )
                minmax(
                    280px,
                    .85fr
                );
            gap: 12px;
        }

        .usageCard {
            min-height: 330px;
            padding: 18px;
        }

        .cardHead {
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            gap: 14px;
        }

        .cardTitle {
            color: #ddd;
            font-size: 13px;
            font-weight: 600;
        }

        .cardText {
            margin-top: 5px;
            color: #5d5d5d;
            font-size: 9px;
            line-height: 1.5;
        }

        .activityTotal {
            color: #888;
            font-size: 10px;
            font-weight: 600;
        }

        .chart {
            height: 218px;
            margin-top: 22px;
            padding: 0 4px 4px;
            display: grid;
            grid-template-columns:
                repeat(
                    7,
                    1fr
                );
            align-items: end;
            gap: 11px;
            border-bottom:
                1px solid #1d1d1d;
        }

        .barCol {
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            align-items: center;
            gap: 8px;
        }

        .barTrack {
            width: 100%;
            height: 174px;
            display: flex;
            align-items: flex-end;
            justify-content: center;
        }

        .bar {
            width: min(34px,72%);
            min-height: 4px;
            border: 1px solid #9d2929;
            border-radius: 7px 7px 3px 3px;
            background:
                linear-gradient(
                    180deg,
                    #e24444,
                    #b42121
                );
            box-shadow:
                inset 1px 1px 0 rgba(255,255,255,.16),
                0 0 18px rgba(215,40,40,.07);
            transition:
                height .35s ease;
        }

        .barDay {
            color: #535353;
            font-size: 8px;
        }

        .side {
            display: grid;
            gap: 12px;
        }

        .licenseCard,
        .securityCard {
            padding: 18px;
        }

        .licenseBox {
            margin-top: 16px;
            padding: 14px;
            border: 1px solid #202020;
            border-radius: 10px;
            background: #080808;
        }

        .licenseDisplay {
            min-height: 21px;
            color: #d6d6d6;
            font-family:
                ui-monospace,
                SFMono-Regular,
                Menlo,
                Consolas,
                monospace;
            font-size: 12px;
            letter-spacing: .055em;
            word-break: break-all;
            user-select: none;
            filter: blur(5px);
            transition:
                filter .18s;
        }

        .licenseDisplay.revealed {
            filter: none;
            user-select: text;
        }

        .licenseActions {
            margin-top: 12px;
            display: grid;
            grid-template-columns:
                1fr 1fr;
            gap: 8px;
        }

        .smallBtn,
        .actionBtn {
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            transition:
                transform .13s,
                filter .13s,
                opacity .13s;
        }

        .smallBtn {
            min-height: 35px;
            border: 1px solid #292929;
            background: #141414;
            color: #aaa;
            font-size: 9px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 7px;
        }

        .smallBtn:hover,
        .actionBtn:hover {
            filter: brightness(1.08);
            transform: translateY(-1px);
        }

        .smallBtn svg,
        .actionBtn svg {
            width: 13px;
            height: 13px;
        }

        .securityRows {
            margin-top: 15px;
            display: grid;
            gap: 9px;
        }

        .securityRow {
            min-height: 37px;
            padding: 0 11px;
            border: 1px solid #1d1d1d;
            border-radius: 8px;
            background: #0d0d0d;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            font-size: 9px;
        }

        .securityRow span:first-child {
            color: #646464;
        }

        .securityRow span:last-child {
            color: #aaa;
            text-align: right;
        }

        .accountDock {
            position: fixed;
            right: 18px;
            bottom: 18px;
            z-index: 80;
        }

        .accountTrigger {
            min-width: 210px;
            max-width:
                min(
                    310px,
                    calc(100vw - 28px)
                );
            min-height: 58px;
            padding:
                8px
                11px
                8px
                8px;
            border: 1px solid #242424;
            border-radius: 13px;
            background:
                radial-gradient(
                    circle at 8% 0%,
                    rgba(255,255,255,.06),
                    transparent 30%
                ),
                rgba(12,12,12,.97);
            backdrop-filter: blur(18px);
            box-shadow:
                0 16px 50px rgba(0,0,0,.48);
            color: inherit;
            display: flex;
            align-items: center;
            gap: 10px;
            cursor: pointer;
            text-align: left;
        }

        .accountAvatar {
            width: 40px;
            height: 40px;
            min-width: 40px;
            border-radius: 50%;
            border: 1px solid #292929;
            background: #171717;
            color: #6c6c6c;
            display: grid;
            place-items: center;
            overflow: hidden;
        }

        .accountAvatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .accountAvatar svg {
            width: 18px;
            height: 18px;
        }

        .accountWords {
            min-width: 0;
            flex: 1;
        }

        .accountName {
            color: #e2e2e2;
            font-size: 11px;
            font-weight: 600;
            overflow: hidden;
            white-space: nowrap;
            text-overflow: ellipsis;
        }

        .accountSub {
            margin-top: 3px;
            color: #696969;
            font-size: 9px;
            overflow: hidden;
            white-space: nowrap;
            text-overflow: ellipsis;
        }

        .accountTrigger > svg {
            width: 14px;
            height: 14px;
            color: #666;
        }

        .accountMenu {
            position: absolute;
            right: 0;
            bottom: 68px;
            width:
                min(
                    290px,
                    calc(100vw - 28px)
                );
            padding: 10px;
            border: 1px solid #242424;
            border-radius: 13px;
            background:
                rgba(11,11,11,.985);
            box-shadow:
                0 22px 70px rgba(0,0,0,.55);
            backdrop-filter: blur(18px);
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
            transform:
                translateY(
                    8px
                );
            transition:
                opacity .16s,
                transform .16s,
                visibility .16s;
        }

        .accountMenu.on {
            opacity: 1;
            visibility: visible;
            pointer-events: auto;
            transform: none;
        }

        .menuProfile {
            padding:
                8px
                8px
                11px;
            border-bottom:
                1px solid #191919;
            margin-bottom: 8px;
        }

        .menuBtn {
            width: 100%;
            min-height: 39px;
            padding: 0 11px;
            border: 0;
            border-radius: 8px;
            background: transparent;
            color: #9c9c9c;
            display: flex;
            align-items: center;
            gap: 9px;
            cursor: pointer;
            text-align: left;
            font-size: 10px;
            font-weight: 600;
        }

        .menuBtn:hover {
            background: #151515;
            color: #ddd;
        }

        .menuBtn svg {
            width: 15px;
            height: 15px;
        }

        .menuBtn.forum {
            color: #b8b8b8;
        }

        .menuBtn.admin {
            color: #d7a45c;
        }

        .menuBtn.discord {
            margin-top: 5px;
            color: #fff;
            border: 1px solid #6872e2;
            background:
                linear-gradient(
                    145deg,
                    #6d78e8,
                    #5865f2 58%,
                    #4752c4
                );
            box-shadow:
                0 3px 0 #858deb,
                inset 1px 1px 0 rgba(255,255,255,.14);
        }

        .menuBtn.logout {
            color: #a65f5f;
        }

        .modalBack {
            position: fixed;
            inset: 0;
            z-index: 100;
            padding: 18px;
            background:
                rgba(0,0,0,.68);
            backdrop-filter: blur(11px);
            display: grid;
            place-items: center;
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
            transition:
                opacity .16s,
                visibility .16s;
        }

        .modalBack.on {
            opacity: 1;
            visibility: visible;
            pointer-events: auto;
        }

        .modal {
            width:
                min(
                    480px,
                    100%
                );
            max-height:
                calc(
                    100vh -
                    36px
                );
            overflow: auto;
            border: 1px solid #262626;
            border-radius: 13px;
            background: #0b0b0b;
            box-shadow:
                0 28px 90px rgba(0,0,0,.65);
        }

        .modalHead {
            min-height: 57px;
            padding: 0 17px;
            border-bottom:
                1px solid #1b1b1b;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .modalTitle {
            color: #ddd;
            font-size: 13px;
            font-weight: 600;
        }

        .closeBtn {
            width: 32px;
            height: 32px;
            border: 1px solid #242424;
            border-radius: 8px;
            background: #111;
            color: #777;
            display: grid;
            place-items: center;
            cursor: pointer;
        }

        .closeBtn svg {
            width: 14px;
            height: 14px;
        }

        .modalBody {
            padding: 16px;
            display: grid;
            gap: 11px;
        }

        .settingBox {
            padding: 14px;
            border: 1px solid #202020;
            border-radius: 10px;
            background: #090909;
        }

        .settingTitle {
            color: #d1d1d1;
            font-size: 11px;
            font-weight: 600;
        }

        .settingText {
            margin-top: 5px;
            color: #626262;
            font-size: 9px;
            line-height: 1.5;
        }

        .actionBtn {
            width: 100%;
            min-height: 38px;
            margin-top: 11px;
            border: 1px solid #2a2a2a;
            background: #151515;
            color: #b8b8b8;
            font-size: 9px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 7px;
        }

        .actionBtn.discord {
            color: #fff;
            border-color: #6872e2;
            background:
                linear-gradient(
                    145deg,
                    #6d78e8,
                    #5865f2 58%,
                    #4752c4
                );
            box-shadow:
                0 3px 0 #858deb;
        }

        .passwordForm {
            margin-top: 13px;
            display: grid;
            gap: 9px;
        }

        .passwordForm.locked input,
        .passwordForm.locked button[type="submit"] {
            opacity: .48;
            cursor: not-allowed;
        }

        .passwordForm input {
            width: 100%;
            height: 41px;
            padding: 0 11px;
            border: 1px solid #242424;
            border-radius: 8px;
            outline: none;
            background: #090909;
            color: #e1e1e1;
            font-size: 10px;
        }

        .passwordForm input:focus {
            border-color: #703030;
            box-shadow:
                0 0 0 3px rgba(215,40,40,.055);
        }

        .passwordMsg {
            min-height: 14px;
            color: #6e6e6e;
            font-size: 9px;
            line-height: 1.5;
        }

        .toast {
            position: fixed;
            left: 50%;
            bottom: 24px;
            transform:
                translate(
                    -50%,
                    12px
                );
            z-index: 130;
            min-width: 180px;
            max-width:
                min(
                    420px,
                    calc(100vw - 28px)
                );
            padding: 11px 14px;
            border: 1px solid #272727;
            border-radius: 9px;
            background: #101010;
            color: #bbb;
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
            text-align: center;
            font-size: 9px;
            transition:
                opacity .15s,
                transform .15s,
                visibility .15s;
        }

        .toast.on {
            opacity: 1;
            visibility: visible;
            transform:
                translate(
                    -50%,
                    0
                );
        }

        .loading {
            min-height: 300px;
            display: grid;
            place-items: center;
            color: #555;
            font-size: 10px;
        }

        .spin {
            width: 23px;
            height: 23px;
            border: 2px solid #202020;
            border-top-color: #bd2b2b;
            border-radius: 50%;
            animation:
                spin .75s linear infinite;
        }

        @keyframes spin {
            to {
                transform:
                    rotate(
                        360deg
                    );
            }
        }

        @media (
            max-width: 900px
        ) {
            .stats {
                grid-template-columns:
                    repeat(
                        2,
                        minmax(
                            0,
                            1fr
                        )
                    );
            }

            .layout {
                grid-template-columns:
                    1fr;
            }
        }

        @media (
            max-width: 620px
        ) {
            .top {
                height: 62px;
            }

            .logo {
                width: 118px;
                height: 42px;
            }

            .nav {
                gap: 13px;
            }

            .nav a {
                font-size: 9px;
            }

            .nav a.on::after {
                bottom: 15px;
            }

            .home {
                width: 32px;
                height: 32px;
            }

            .shell {
                width:
                    min(
                        calc(100% - 20px),
                        1180px
                    );
                padding-top: 23px;
            }

            .stats {
                grid-template-columns:
                    1fr;
            }

            .hero {
                align-items:
                    flex-start;
            }

            .chart {
                gap: 5px;
            }

            .bar {
                width:
                    min(
                        27px,
                        78%
                    );
            }

            .accountDock {
                right: 10px;
                bottom: 10px;
            }

            .accountTrigger {
                min-width: 190px;
            }
        }

        @media (
            max-width: 430px
        ) {
            .nav a:first-child {
                display: none;
            }

            .nav {
                gap: 17px;
            }

            .accountTrigger {
                min-width: 0;
                width:
                    min(
                        230px,
                        calc(100vw - 20px)
                    );
            }
        }
    </style>
</head>

<body>
    <header class="top">
        <a href="index.html">
            <img
                class="logo"
                src="assets/logo.png"
                alt="Venom"
            >
        </a>

        <nav class="nav">
            <a href="index.html">
                Home
            </a>

            <a
                class="on"
                href="dashboard.html"
            >
                Dashboard
            </a>

            <a href="forum.html">
                Forum
            </a>

            <a href="products.html">
                Products
            </a>
        </nav>

        <a
            class="home"
            href="index.html"
            aria-label="Back home"
        >
            <i data-lucide="house"></i>
        </a>
    </header>

    <main
        class="shell"
        id="dashboard"
    >
        <div class="loading">
            <div class="spin"></div>
        </div>
    </main>

    <div
        class="accountDock"
        id="accountDock"
        hidden
    >
        <div
            class="accountMenu"
            id="accountMenu"
        >
            <div
                class="menuProfile"
                id="menuProfile"
            ></div>

            <button
                class="menuBtn forum"
                id="forumBtn"
                type="button"
            >
                <i data-lucide="messages-square"></i>

                Forum
            </button>

            <button
                class="menuBtn admin"
                id="adminBtn"
                type="button"
                hidden
            >
                <i data-lucide="hammer"></i>

                Admin
            </button>

            <button
                class="menuBtn"
                id="settingsBtn"
                type="button"
            >
                <i data-lucide="settings"></i>

                Settings
            </button>

            <button
                class="menuBtn discord"
                id="connectDiscordBtn"
                type="button"
                hidden
            >
                Connect Discord
            </button>

            <button
                class="menuBtn logout"
                id="logoutBtn"
                type="button"
            >
                <i data-lucide="log-out"></i>

                Logout
            </button>
        </div>

        <button
            class="accountTrigger"
            id="accountTrigger"
            type="button"
        >
            <div
                class="accountAvatar"
                id="dockAvatar"
            >
                <i data-lucide="user-round"></i>
            </div>

            <div class="accountWords">
                <div
                    class="accountName"
                    id="dockName"
                >
                    Account
                </div>

                <div
                    class="accountSub"
                    id="dockSub"
                >
                    Loading...
                </div>
            </div>

            <i data-lucide="chevron-up"></i>
        </button>
    </div>

    <div
        class="modalBack"
        id="settingsBack"
    >
        <section class="modal">
            <div class="modalHead">
                <div class="modalTitle">
                    Settings
                </div>

                <button
                    class="closeBtn"
                    id="settingsClose"
                    type="button"
                    aria-label="Close settings"
                >
                    <i data-lucide="x"></i>
                </button>
            </div>

            <div class="modalBody">
                <div class="settingBox">
                    <div class="settingTitle">
                        Password
                    </div>

                    <div
                        class="settingText"
                        id="passwordSecurityText"
                    >
                        Authenticate with Discord to unlock password editing.
                    </div>

                    <button
                        class="actionBtn discord"
                        id="passwordReauthBtn"
                        type="button"
                    >
                        Authenticate with Discord
                    </button>

                    <form
                        class="passwordForm locked"
                        id="passwordForm"
                    >
                        <input
                            id="newPassword"
                            type="password"
                            minlength="8"
                            maxlength="256"
                            autocomplete="new-password"
                            placeholder="New password"
                            disabled
                        >

                        <input
                            id="confirmPassword"
                            type="password"
                            minlength="8"
                            maxlength="256"
                            autocomplete="new-password"
                            placeholder="Confirm new password"
                            disabled
                        >

                        <button
                            class="actionBtn"
                            type="submit"
                            disabled
                        >
                            <i data-lucide="key-round"></i>

                            Change password
                        </button>

                        <div
                            class="passwordMsg"
                            id="passwordMsg"
                        ></div>
                    </form>
                </div>

                <div class="settingBox">
                    <div class="settingTitle">
                        Account security
                    </div>

                    <div
                        class="settingText"
                        id="securitySummary"
                    >
                        Loading account security...
                    </div>
                </div>
            </div>
        </section>
    </div>

    <div
        class="toast"
        id="toast"
    ></div>

    <script src="dashboard.js?v=6"></script>
</body>
</html>
