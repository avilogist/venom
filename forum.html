<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1"
    >

    <title>Venom | Forum</title>

    <link
        rel="icon"
        type="image/png"
        href="assets/venom.png"
    >

    <link
        rel="preconnect"
        href="https://fonts.googleapis.com"
    >

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin
    >

    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
        rel="stylesheet"
    >

    <script src="https://unpkg.com/lucide@latest"></script>

    <style>
        * {
            box-sizing: border-box;
        }

        [hidden] {
            display: none !important;
        }

        html,
        body {
            margin: 0;
            min-height: 100%;
            background: #050505;
            color: #eee;
            font-family: Inter, system-ui, sans-serif;
        }

        body {
            min-height: 100vh;
            background:
                radial-gradient(
                    circle at 18% -10%,
                    rgba(213,40,40,.08),
                    transparent 30%
                ),
                radial-gradient(
                    circle at 90% 10%,
                    rgba(255,255,255,.025),
                    transparent 22%
                ),
                #050505;
        }

        button,
        input,
        textarea,
        select {
            font: inherit;
        }

        .top {
            height: 70px;
            padding: 0 clamp(15px,3vw,30px);
            border-bottom: 1px solid #171717;
            background: rgba(5,5,5,.94);
            backdrop-filter: blur(16px);
            display: flex;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 40;
        }

        .logo {
            width: clamp(145px,16vw,190px);
            height: 50px;
            object-fit: contain;
            object-position: left center;
        }

        .nav {
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
            height: 100%;
            display: flex;
            align-items: center;
            gap: clamp(15px,2.4vw,30px);
        }

        .nav a {
            height: 100%;
            display: flex;
            align-items: center;
            color: #777;
            text-decoration: none;
            font-size: 11px;
            font-weight: 600;
            letter-spacing: .07em;
            position: relative;
        }

        .nav a:hover,
        .nav a.on {
            color: #d92d2d;
        }

        .nav a.on::after {
            content: "";
            position: absolute;
            left: 0;
            right: 0;
            bottom: 19px;
            height: 2px;
            border-radius: 999px;
            background: #d92d2d;
        }

        .home {
            margin-left: auto;
            width: 36px;
            height: 36px;
            border: 1px solid #202020;
            border-radius: 9px;
            color: #888;
            background: #0d0d0d;
            display: grid;
            place-items: center;
            text-decoration: none;
        }

        .home:hover {
            color: #d92d2d;
            border-color: #342020;
        }

        .home svg {
            width: 17px;
            height: 17px;
        }

        .shell {
            width:
                min(
                    1120px,
                    calc(100% - 28px)
                );
            margin: 0 auto;
            padding: 32px 0 90px;
        }

        .hero {
            display: flex;
            align-items: flex-end;
            justify-content: space-between;
            gap: 20px;
            margin-bottom: 18px;
        }

        .hero h1 {
            margin: 0;
            font-size: clamp(24px,3vw,34px);
            letter-spacing: -.035em;
            font-weight: 600;
        }

        .hero p {
            margin: 7px 0 0;
            color: #666;
            font-size: 11px;
            line-height: 1.6;
        }

        .identity {
            min-width: 0;
            display: flex;
            align-items: center;
            gap: 9px;
        }

        .avatar {
            width: 38px;
            height: 38px;
            min-width: 38px;
            border-radius: 50%;
            border: 1px solid #292929;
            overflow: hidden;
            background: #111;
            display: grid;
            place-items: center;
            color: #666;
        }

        .avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .avatar svg {
            width: 16px;
            height: 16px;
        }

        .identityName {
            display: flex;
            align-items: center;
            gap: 5px;
            color: #ddd;
            font-size: 11px;
            font-weight: 600;
            min-width: 0;
        }

        .identitySub {
            margin-top: 3px;
            color: #555;
            font-size: 9px;
        }

        .badge {
            width: 15px;
            height: 15px;
            object-fit: contain;
            vertical-align: middle;
            filter:
                drop-shadow(
                    0 1px 3px rgba(0,0,0,.6)
                );
        }

        .layout {
            display: grid;
            grid-template-columns:
                220px
                minmax(
                    0,
                    1fr
                );
            gap: 12px;
        }

        .side,
        .feed,
        .composer {
            border: 1px solid #1c1c1c;
            border-radius: 13px;
            background:
                rgba(11,11,11,.92);
            box-shadow:
                inset 1px 1px 0 rgba(255,255,255,.02),
                0 14px 42px rgba(0,0,0,.2);
        }

        .side {
            padding: 11px;
            height: fit-content;
            position: sticky;
            top: 84px;
        }

        .sideTitle {
            padding: 8px 8px 10px;
            color: #575757;
            font-size: 9px;
            font-weight: 700;
            letter-spacing: .08em;
            text-transform: uppercase;
        }

        .channel {
            width: 100%;
            min-height: 41px;
            border: 0;
            border-radius: 8px;
            background: #151515;
            color: #d8d8d8;
            display: flex;
            align-items: center;
            gap: 9px;
            padding: 0 10px;
            font-size: 10px;
            font-weight: 600;
            text-align: left;
        }

        .channel svg {
            width: 15px;
            height: 15px;
            color: #d92d2d;
        }

        .main {
            min-width: 0;
            display: grid;
            gap: 12px;
        }

        .composer {
            padding: 17px;
        }

        .composer h2 {
            margin: 0;
            font-size: 13px;
            font-weight: 600;
        }

        .composerSub {
            margin-top: 5px;
            color: #595959;
            font-size: 9px;
        }

        .field {
            margin-top: 12px;
            display: grid;
            gap: 6px;
        }

        .field label {
            color: #6a6a6a;
            font-size: 9px;
            font-weight: 600;
        }

        .field input,
        .field textarea,
        .field select {
            width: 100%;
            border: 1px solid #242424;
            border-radius: 8px;
            background: #080808;
            color: #ddd;
            outline: none;
        }

        .field input,
        .field select {
            height: 39px;
            padding: 0 10px;
        }

        .field textarea {
            min-height: 165px;
            padding: 10px;
            resize: vertical;
            line-height: 1.55;
        }

        .field input:focus,
        .field textarea:focus,
        .field select:focus {
            border-color: #5c2929;
            box-shadow:
                0 0 0 3px rgba(215,40,40,.05);
        }

        .row {
            display: grid;
            grid-template-columns:
                1fr 1fr;
            gap: 9px;
        }

        .selectedOnly {
            display: none;
        }

        .selectedOnly.on {
            display: grid;
        }

        .imageTools {
            margin-top: 10px;
            display: grid;
            gap: 8px;
        }

        .imageAdd {
            min-height: 38px;
            border: 1px solid #292929;
            border-radius: 8px;
            background: #121212;
            color: #aaa;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 7px;
            font-size: 10px;
            font-weight: 600;
        }

        .imageAdd svg {
            width: 14px;
            height: 14px;
        }

        .imageList {
            display: grid;
            gap: 8px;
        }

        .imageItem {
            border: 1px solid #202020;
            border-radius: 9px;
            padding: 8px;
            background: #090909;
            display: grid;
            grid-template-columns:
                88px 1fr auto;
            gap: 8px;
            align-items: center;
        }

        .imageItem img {
            width: 88px;
            height: 62px;
            object-fit: cover;
            border-radius: 6px;
        }

        .imageOptions {
            display: grid;
            grid-template-columns:
                1fr 1fr;
            gap: 6px;
        }

        .imageOptions select,
        .imageOptions input {
            height: 32px;
        }

        .iconBtn {
            width: 32px;
            height: 32px;
            border: 1px solid #292929;
            border-radius: 7px;
            background: #111;
            color: #888;
            display: grid;
            place-items: center;
            cursor: pointer;
        }

        .iconBtn svg {
            width: 13px;
            height: 13px;
        }

        .composeActions {
            margin-top: 12px;
            display: flex;
            justify-content: flex-end;
            gap: 8px;
        }

        .btn {
            min-height: 38px;
            padding: 0 14px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 10px;
            font-weight: 600;
        }

        .btn.primary {
            border: 1px solid #b52a2a;
            background:
                linear-gradient(
                    145deg,
                    #df4141,
                    #bd2525
                );
            color: white;
            box-shadow:
                0 3px 0 #792020;
        }

        .btn.secondary {
            border: 1px solid #292929;
            background: #121212;
            color: #9a9a9a;
        }

        .feed {
            overflow: hidden;
        }

        .feedHead {
            padding: 14px 16px;
            border-bottom: 1px solid #191919;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .feedTitle {
            color: #d8d8d8;
            font-size: 12px;
            font-weight: 600;
        }

        .feedCount {
            color: #505050;
            font-size: 9px;
        }

        .post {
            padding: 18px;
            border-bottom: 1px solid #181818;
        }

        .post:last-child {
            border-bottom: 0;
        }

        .postHead {
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            gap: 12px;
        }

        .author {
            display: flex;
            align-items: center;
            gap: 9px;
            min-width: 0;
        }

        .authorWords {
            min-width: 0;
        }

        .authorName {
            display: flex;
            align-items: center;
            gap: 4px;
            color: #d8d8d8;
            font-size: 10px;
            font-weight: 600;
        }

        .postTime {
            margin-top: 3px;
            color: #505050;
            font-size: 8px;
        }

        .postTitle {
            margin: 15px 0 0;
            color: #efefef;
            font-size: 17px;
            font-weight: 600;
            letter-spacing: -.02em;
        }

        .markdown {
            margin-top: 10px;
            color: #aaa;
            font-size: 11px;
            line-height: 1.7;
            overflow-wrap: anywhere;
        }

        .markdown h1,
        .markdown h2,
        .markdown h3 {
            color: #e3e3e3;
            line-height: 1.25;
        }

        .markdown h1 {
            font-size: 18px;
        }

        .markdown h2 {
            font-size: 16px;
        }

        .markdown h3 {
            font-size: 14px;
        }

        .markdown p {
            margin: 8px 0;
        }

        .markdown ul {
            padding-left: 19px;
        }

        .markdown li {
            margin: 4px 0;
        }

        .markdown code {
            padding: 2px 5px;
            border: 1px solid #252525;
            border-radius: 5px;
            background: #090909;
            color: #ccc;
            font-family:
                ui-monospace,
                SFMono-Regular,
                Menlo,
                Consolas,
                monospace;
        }

        .markdown pre {
            padding: 11px;
            overflow: auto;
            border: 1px solid #222;
            border-radius: 8px;
            background: #080808;
        }

        .markdown pre code {
            padding: 0;
            border: 0;
        }

        .markdown a {
            color: #da5555;
            text-decoration: none;
        }

        .postImages {
            margin-top: 13px;
            display: flow-root;
        }

        .postImage {
            display: block;
            max-height: 620px;
            object-fit: contain;
            border: 1px solid #202020;
            border-radius: 9px;
            background: #080808;
            margin: 8px 0;
        }

        .postImage.left {
            float: left;
            margin-right: 12px;
        }

        .postImage.right {
            float: right;
            margin-left: 12px;
        }

        .postImage.center {
            margin-left: auto;
            margin-right: auto;
        }

        .postActions {
            margin-top: 14px;
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
        }

        .action {
            min-height: 32px;
            padding: 0 9px;
            border: 1px solid #242424;
            border-radius: 7px;
            background: transparent;
            color: #797979;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            cursor: pointer;
            font-size: 9px;
            transition:
                color .14s,
                border-color .14s,
                transform .14s;
        }

        .action:hover {
            color: #aaa;
            border-color: #303030;
        }

        .action:active {
            transform: scale(.97);
        }

        .action.on {
            color: #e44848;
            border-color: #353535;
            background: transparent;
        }

        .action.likePost.on svg {
            fill: currentColor;
            stroke: currentColor;
        }

        .action.likePost:not(.on) svg {
            fill: none;
        }

        .action.danger {
            margin-left: auto;
            color: #a55757;
        }

        .action svg {
            width: 13px;
            height: 13px;
        }

        .comments {
            margin-top: 14px;
            padding-top: 13px;
            border-top: 1px solid #1a1a1a;
            display: grid;
            gap: 8px;
        }

        .comment {
            display: grid;
            grid-template-columns:
                30px 1fr auto;
            gap: 8px;
            align-items: flex-start;
        }

        .comment .avatar {
            width: 30px;
            height: 30px;
            min-width: 30px;
        }

        .commentBody {
            padding: 9px 10px;
            border: 1px solid #1e1e1e;
            border-radius: 8px;
            background: #090909;
            min-width: 0;
        }

        .commentMeta {
            display: flex;
            align-items: center;
            gap: 5px;
            color: #777;
            font-size: 8px;
        }

        .commentText {
            margin-top: 5px;
            color: #9b9b9b;
            font-size: 10px;
            line-height: 1.55;
        }

        .commentForm {
            margin-top: 7px;
            display: grid;
            grid-template-columns:
                1fr auto;
            gap: 7px;
        }

        .commentForm textarea {
            min-height: 42px;
            max-height: 130px;
            resize: vertical;
            border: 1px solid #242424;
            border-radius: 8px;
            background: #080808;
            color: #ddd;
            padding: 9px;
            outline: none;
            font-size: 10px;
        }

        .empty,
        .loading {
            padding: 44px 18px;
            text-align: center;
            color: #555;
            font-size: 10px;
        }

        .toast {
            position: fixed;
            left: 50%;
            bottom: 24px;
            transform:
                translate(
                    -50%,
                    12px
                );
            z-index: 100;
            padding: 10px 14px;
            border: 1px solid #272727;
            border-radius: 9px;
            background: #101010;
            color: #bbb;
            font-size: 9px;
            opacity: 0;
            visibility: hidden;
            transition: .15s;
        }

        .toast.on {
            opacity: 1;
            visibility: visible;
            transform:
                translate(
                    -50%,
                    0
                );
        }

        @media (
            max-width: 760px
        ) {
            .layout {
                grid-template-columns:
                    1fr;
            }

            .side {
                position: static;
            }

            .row {
                grid-template-columns:
                    1fr;
            }

            .hero {
                align-items: flex-start;
                flex-direction: column;
            }
        }

        @media (
            max-width: 520px
        ) {
            .top {
                height: 62px;
            }

            .logo {
                width: 118px;
            }

            .nav a:first-child {
                display: none;
            }

            .post {
                padding: 14px;
            }

            .imageItem {
                grid-template-columns:
                    72px 1fr auto;
            }

            .imageItem img {
                width: 72px;
                height: 54px;
            }
        }
    </style>
</head>

<body>
    <header class="top">
        <a href="index.html">
            <img
                class="logo"
                src="assets/logo.png"
                alt="Venom"
            >
        </a>

        <nav class="nav">
            <a href="index.html">
                Home
            </a>

            <a href="dashboard.html">
                Dashboard
            </a>

            <a
                class="on"
                href="forum.html"
            >
                Forum
            </a>
        </nav>

        <a
            class="home"
            href="dashboard.html"
            aria-label="Dashboard"
        >
            <i data-lucide="layout-dashboard"></i>
        </a>
    </header>

    <main class="shell">
        <section class="hero">
            <div>
                <h1>
                    Forum
                </h1>

                <p>
                    Announcements and updates from Venom.
                </p>
            </div>

            <div
                class="identity"
                id="identity"
                hidden
            ></div>
        </section>

        <div class="layout">
            <aside class="side">
                <div class="sideTitle">
                    Channels
                </div>

                <button
                    class="channel"
                    type="button"
                >
                    <i data-lucide="megaphone"></i>

                    <span>
                        Announcements
                    </span>
                </button>
            </aside>

            <section class="main">
                <div
                    class="composer"
                    id="composer"
                    hidden
                >
                    <h2>
                        New announcement
                    </h2>

                    <div class="composerSub">
                        Admin only. Markdown and up to 4 embedded images are supported.
                    </div>

                    <div class="field">
                        <label for="postTitle">
                            Title
                        </label>

                        <input
                            id="postTitle"
                            maxlength="180"
                        >
                    </div>

                    <div class="field">
                        <label for="postBody">
                            Markdown
                        </label>

                        <textarea
                            id="postBody"
                            maxlength="20000"
                            placeholder="# Announcement"
                        ></textarea>
                    </div>

                    <div class="row">
                        <div class="field">
                            <label for="commentMode">
                                Comments
                            </label>

                            <select id="commentMode">
                                <option value="everyone">
                                    Everyone
                                </option>

                                <option value="selected">
                                    Selected users
                                </option>

                                <option value="nobody">
                                    Nobody
                                </option>
                            </select>
                        </div>

                        <div
                            class="field selectedOnly"
                            id="selectedOnly"
                        >
                            <label for="selectedUsers">
                                Allowed usernames
                            </label>

                            <input
                                id="selectedUsers"
                                placeholder="alice, bob, charlie"
                            >
                        </div>
                    </div>

                    <div class="imageTools">
                        <input
                            id="imageInput"
                            type="file"
                            accept="image/png,image/jpeg,image/gif,image/webp"
                            multiple
                            hidden
                        >

                        <button
                            class="imageAdd"
                            id="imageAdd"
                            type="button"
                        >
                            <i data-lucide="image-plus"></i>

                            <span>
                                Add images
                            </span>
                        </button>

                        <div
                            class="imageList"
                            id="imageList"
                        ></div>
                    </div>

                    <div class="composeActions">
                        <button
                            class="btn secondary"
                            id="cancelEdit"
                            type="button"
                            hidden
                        >
                            Cancel edit
                        </button>

                        <button
                            class="btn primary"
                            id="publishPost"
                            type="button"
                        >
                            Publish announcement
                        </button>
                    </div>
                </div>

                <div class="feed">
                    <div class="feedHead">
                        <div class="feedTitle">
                            Announcements
                        </div>

                        <div
                            class="feedCount"
                            id="feedCount"
                        >
                            Loading...
                        </div>
                    </div>

                    <div id="feed">
                        <div class="loading">
                            Loading announcements...
                        </div>
                    </div>
                </div>
            </section>
        </div>
    </main>

    <div
        class="toast"
        id="toast"
    ></div>

    <script src="forum.js?v=1"></script>
</body>
</html>
